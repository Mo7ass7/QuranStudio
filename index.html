<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>QuranStudio</title>
<link rel="stylesheet" href="fonts/fonts.css?v=3">
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
  <header class="topbar">
    <h1>QuranStudio</h1>
    <p class="sub">أنشئ فيديو قرآني قصير مباشرة من متصفحك</p>
  </header>

  <main class="wrap">

    <!-- التبويبات -->
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="surah">السورة</button>
      <button class="tab-btn" data-tab="reciter">القارئ</button>
      <button class="tab-btn" data-tab="background">الخلفية</button>
      <button class="tab-btn" data-tab="font">الخط</button>
      <button class="tab-btn" data-tab="display">العرض</button>
    </nav>

    <!-- تبويب السورة -->
    <section class="tab-panel active" data-panel="surah">
      <label class="field-label" for="surahSelect">السورة</label>
      <select id="surahSelect" class="select"></select>

      <div class="ayah-range">
        <div class="ayah-stepper">
          <span class="field-label">من آية</span>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="fromMinus">−</button>
            <span id="fromValue" class="stepper-value">1</span>
            <button type="button" class="stepper-btn" id="fromPlus">+</button>
          </div>
        </div>
        <div class="ayah-stepper">
          <span class="field-label">إلى آية</span>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="toMinus">−</button>
            <span id="toValue" class="stepper-value">1</span>
            <button type="button" class="stepper-btn" id="toPlus">+</button>
          </div>
        </div>
      </div>
      <p class="hint" id="surahHint"></p>
    </section>

    <!-- تبويب القارئ -->
    <section class="tab-panel" data-panel="reciter">
      <label class="field-label">اختر القارئ</label>
      <div class="reciter-grid" id="reciterGrid"></div>
    </section>

    <!-- تبويب الخلفية -->
    <section class="tab-panel" data-panel="background">
      <label class="field-label">اختر الخلفية</label>
      <div class="bg-grid" id="bgGrid"></div>
      <input type="file" id="bgFileInput" accept="image/*,video/*" hidden>
      <button type="button" id="btnUploadBg" class="btn btn-secondary bg-upload-btn">رفع من الجهاز (صورة أو فيديو)</button>
      <p class="hint" id="bgHint"></p>
    </section>

    <!-- تبويب الخط -->
    <section class="tab-panel" data-panel="font">
      <label class="field-label">اختر الخط</label>
      <div class="font-list" id="fontList"></div>
    </section>

    <!-- تبويب العرض -->
    <section class="tab-panel" data-panel="display">
      <label class="toggle-row">
        <span>إظهار اسم القارئ</span>
        <input type="checkbox" id="toggleReciterName" checked>
      </label>

      <label class="field-label" style="margin-top:16px;">شكل عداد الآيات</label>
      <div class="counter-style-list" id="counterStyleList"></div>

      <label class="field-label" style="margin-top:16px;">نسبة العرض</label>
      <div class="option-row" id="aspectRatioList"></div>

      <label class="field-label" style="margin-top:16px;">الجودة</label>
      <div class="option-row" id="qualityList"></div>
    </section>

    <!-- أزرار التحكم -->
    <div class="actions-row">
      <button id="btnGenerate" class="btn btn-primary">أنشئ المعاينة</button>
      <button id="btnReset" class="btn btn-secondary">إعادة تعيين</button>
    </div>

    <div id="generateStatus" class="status"></div>

    <!-- إطار المعاينة -->
    <div class="frame-wrap" id="frameWrap" hidden>
      <canvas id="previewCanvas" width="1080" height="1920"></canvas>
    </div>

    <!-- عناصر المشغّل (خارج الـ Canvas تمامًا) -->
    <div class="player-controls" id="playerControls" hidden>
      <input type="range" id="seekBar" class="seek-bar" min="0" max="1000" value="0" step="1">
      <div class="time-row">
        <span id="timeCurrent">0:00</span>
        <span id="timeTotal">0:00</span>
      </div>
      <div class="transport-row">
        <button id="btnRestart" class="transport-btn" title="من البداية">⏮</button>
        <button id="btnBack5" class="transport-btn" title="رجوع 5 ثوانٍ">−5</button>
        <button id="btnPlayPause" class="transport-btn transport-btn-main" title="تشغيل/إيقاف">▶</button>
        <button id="btnFwd5" class="transport-btn" title="تقديم 5 ثوانٍ">+5</button>
      </div>
    </div>

    <!-- التصدير -->
    <button id="btnExport" class="btn btn-export" hidden>تحميل / حفظ في المعرض</button>
    <div id="exportProgressWrap" class="export-progress-wrap" hidden>
      <div class="export-progress-track"><div id="exportProgressBar" class="export-progress-bar"></div></div>
      <p id="exportStatus" class="status"></p>
    </div>

    <div id="errorCard" class="card error-card" hidden>
      <h2>⚠️ حدث خطأ</h2>
      <p id="errorMsg"></p>
    </div>

  </main>

  <footer class="foot">
    <p>QuranStudio — المرحلة 3 من 4 · <a href="debug/sources-test.html">صفحة اختبار المصادر</a> · <a href="debug/verify-reciters.html">التحقق من القرّاء</a></p>
  </footer>

  <script src="js/config.js?v=3"></script>
  <script src="js/reciters.js?v=3"></script>
  <script src="js/everyayahIndex.js?v=3"></script>
  <script src="js/quranApi.js?v=3"></script>
  <script src="js/audioEngine.js?v=3"></script>
  <script src="js/backgroundManager.js?v=3"></script>
  <script src="js/renderer.js?v=3"></script>
  <script src="js/player.js?v=3"></script>
  <script src="js/export.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>

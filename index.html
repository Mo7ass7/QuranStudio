<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>QuranStudio</title>
<link rel="stylesheet" href="fonts/fonts.css?v=17">
<link rel="stylesheet" href="css/app.css?v=17">
</head>
<body>
  <header class="topbar">
    <h1>QuranStudio</h1>
    <p class="sub">أنشئ فيديو قرآني قصير مباشرة من متصفحك</p>
  </header>

  <main class="wrap">

    <!-- إطار المعاينة: مباشرة تحت العنوان الفرعي -->
    <div class="frame-wrap" id="frameWrap">
      <canvas id="previewCanvas" width="1080" height="1920" hidden></canvas>
      <div class="frame-placeholder" id="framePlaceholder">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 6a2 2 0 0 1 2-2h8l6 6v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm10.5 4.5L11 12l3.5 1.5v-3z"/></svg>
        <p>اختر السورة والقارئ ثم اضغط «أنشئ المعاينة» أسفل الصفحة لعرضها هنا</p>
      </div>
    </div>

    <!-- عناصر المشغّل (خارج الـ Canvas تمامًا) -->
    <div class="player-controls" id="playerControls" hidden>
      <div class="card">
        <div class="time-row">
          <span id="timeCurrent">0:00</span>
          <span class="dur">المدة: <span id="timeTotal">0:00</span></span>
        </div>
        <input type="range" id="seekBar" class="seek-bar" min="0" max="1000" value="0" step="1">
        <div class="transport-row">
          <button id="btnBack5" class="transport-btn" title="رجوع 5 ثوانٍ">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg><span>5 ث</span>
          </button>
          <button id="btnPlayPause" class="transport-btn transport-btn-main" title="تشغيل/إيقاف">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg><span>تشغيل</span>
          </button>
          <button id="btnFwd5" class="transport-btn" title="تقديم 5 ثوانٍ">
            <span>5 ث</span><svg viewBox="0 0 24 24"><path fill="currentColor" d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button id="btnRestart" class="transport-btn transport-btn-icon" title="من البداية">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L7 6.5 12 11V8a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- الإعدادات: قائمة قابلة للطي (أكورديون) -->
    <div class="accordion" id="settingsAccordion">

      <div class="acc-item open" data-acc="surah">
        <button type="button" class="acc-head"><span class="acc-lbl"><span class="acc-num">١</span>السورة</span><svg class="acc-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></button>
        <div class="acc-body">
          <label class="field-label" for="surahSelect">السورة</label>
          <select id="surahSelect" class="select"></select>

          <div class="ayah-range">
            <div class="ayah-stepper">
              <span class="field-label">من آية</span>
              <div class="stepper">
                <button type="button" class="stepper-btn" id="fromMinus">−</button>
                <input type="text" id="fromValue" class="stepper-value" inputmode="numeric" pattern="[0-9]*" value="1">
                <button type="button" class="stepper-btn" id="fromPlus">+</button>
              </div>
            </div>
            <div class="ayah-stepper">
              <span class="field-label">إلى آية</span>
              <div class="stepper">
                <button type="button" class="stepper-btn" id="toMinus">−</button>
                <input type="text" id="toValue" class="stepper-value" inputmode="numeric" pattern="[0-9]*" value="1">
                <button type="button" class="stepper-btn" id="toPlus">+</button>
              </div>
            </div>
          </div>
          <p class="hint" id="surahHint"></p>
        </div>
      </div>

      <div class="acc-item" data-acc="reciter">
        <button type="button" class="acc-head"><span class="acc-lbl"><span class="acc-num">٢</span>القارئ</span><svg class="acc-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></button>
        <div class="acc-body" hidden>
          <label class="field-label" for="reciterSelect">اختر القارئ</label>
          <select id="reciterSelect" class="select"></select>
          <p class="hint" id="reciterHint"></p>
        </div>
      </div>

      <div class="acc-item" data-acc="background">
        <button type="button" class="acc-head"><span class="acc-lbl"><span class="acc-num">٣</span>الخلفية</span><svg class="acc-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></button>
        <div class="acc-body" hidden>
          <div class="bg-top">
            <label class="field-label" style="margin:0;">اختر الخلفية</label>
            <button type="button" id="btnUploadBg" class="upload-btn">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 20h14v-2H5zM11 16h2V8.8l2.6 2.6L17 10l-5-5-5 5 1.4 1.4L11 8.8z"/></svg>
              <span>رفع من الجهاز</span>
            </button>
            <input type="file" id="bgFileInput" accept="image/*,video/*" hidden>
          </div>
          <div class="bg-grid" id="bgGrid"></div>
          <p class="hint" id="bgHint"></p>
        </div>
      </div>

      <div class="acc-item" data-acc="font">
        <button type="button" class="acc-head"><span class="acc-lbl"><span class="acc-num">٤</span>الخط</span><svg class="acc-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></button>
        <div class="acc-body" hidden>
          <label class="field-label">اختر الخط</label>
          <div class="font-list" id="fontList"></div>
        </div>
      </div>

      <div class="acc-item" data-acc="display">
        <button type="button" class="acc-head"><span class="acc-lbl"><span class="acc-num">٥</span>العرض</span><svg class="acc-chevron" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></button>
        <div class="acc-body" hidden>
          <label class="toggle-row">
            <span>إظهار اسم القارئ</span>
            <input type="checkbox" id="toggleReciterName" checked>
          </label>

          <label class="toggle-row" style="margin-top:8px;">
            <span>إظهار الترجمة الإنجليزية</span>
            <input type="checkbox" id="toggleTranslation">
          </label>

          <label class="field-label" style="margin-top:16px;">شكل عداد الآيات</label>
          <div class="counter-style-list" id="counterStyleList"></div>

          <label class="field-label" style="margin-top:16px;">نسبة العرض</label>
          <div class="option-row" id="aspectRatioList"></div>

          <label class="field-label" style="margin-top:16px;">الجودة</label>
          <div class="option-row" id="qualityList"></div>

          <label class="field-label" for="watermarkInput" style="margin-top:16px;">العلامة المائية (اسم موقعك)</label>
          <input type="text" id="watermarkInput" class="select" maxlength="40">

          <p class="hint support-line" id="recorderSupport"></p>
        </div>
      </div>

    </div>

    <div id="generateStatus" class="status"></div>

    <div id="errorCard" class="card error-card" hidden>
      <svg class="error-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 1 21h22L12 2zm0 6.2a1.2 1.2 0 0 1 1.2 1.2v5.1a1.2 1.2 0 1 1-2.4 0V9.4A1.2 1.2 0 0 1 12 8.2zm0 9.9a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8z"/></svg>
      <div class="error-body">
        <h2>حدث خطأ</h2>
        <p id="errorMsg"></p>
      </div>
    </div>

    <div id="exportProgressWrap" class="export-progress-wrap" hidden>
      <div class="export-progress-track"><div id="exportProgressBar" class="export-progress-bar"></div></div>
      <p id="exportStatus" class="status"></p>
    </div>

  </main>

  <!-- شريط الإجراءات الثابت أسفل الشاشة -->
  <div class="sticky-actions" id="stickyActions">
    <div class="actions-row">
      <button id="btnGenerate" class="btn btn-primary">أنشئ المعاينة</button>
      <button id="btnReset" class="btn btn-secondary">إعادة تعيين</button>
    </div>
    <button id="btnExport" class="btn btn-export" hidden>
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>
      <span>تحميل / حفظ في المعرض</span>
    </button>
  </div>

  <footer class="foot">
    <p>QuranStudio — المرحلة 3 من 4 · <a href="debug/sources-test.html">صفحة اختبار المصادر</a> · <a href="debug/verify-reciters.html">التحقق من القرّاء</a></p>
  </footer>

  <script src="js/config.js?v=17"></script>
  <script src="js/reciters.js?v=17"></script>
  <script src="js/everyayahIndex.js?v=17"></script>
  <script src="js/quranApi.js?v=17"></script>
  <script src="js/audioEngine.js?v=17"></script>
  <script src="js/backgroundManager.js?v=17"></script>
  <script src="js/renderer.js?v=17"></script>
  <script src="js/player.js?v=17"></script>
  <script src="js/export.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
